<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>خدمة مدارس الأحد – فصل الشهيد تادرس الشطبي</title>
<meta name="theme-color" content="#6e1520">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead7;--cd:#fffdf8;--tx:#3a2a2a;--mu:#8a7a70;--mr:#6e1520;--go:#c9962b;--bd:#eadfc6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:#fff;outline:0;margin:4px 0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--go);box-shadow:0 0 0 4px #c9962b24}
.b{background:linear-gradient(135deg,#8c1c2a,#5e0f1a);color:#fff;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;margin:3px;font-weight:700;box-shadow:0 8px 18px #6e152033;transition:.2s}.b:active{transform:scale(.96)}
.b.go{background:linear-gradient(135deg,#e3b95a,#c9962b);color:#2a1a00;box-shadow:0 8px 18px #c9962b44}.b.o{background:none;border:1.5px solid var(--mr);color:var(--mr);box-shadow:none}.b.r{background:linear-gradient(135deg,#d0483f,#a52c25)}.b.g{background:#fff;color:var(--mr);border:1px solid var(--bd);box-shadow:none}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 8px 24px #6e152012;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
h3{margin:0 0 12px;color:var(--mr);font-size:20px}h4{margin:6px 0 10px;color:var(--mr);font-size:18px}small{color:var(--mu)}a{color:var(--go)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.li{padding:9px 0;border-bottom:1px dashed var(--bd)}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--go)}.av.s{width:34px;height:34px}
.app{display:flex;min-height:100vh}
.sb{position:fixed;top:0;bottom:0;right:0;width:262px;background:linear-gradient(180deg,#5e0f1a,#34070e);color:#fff;padding:16px 12px;overflow:auto;z-index:30;transition:.3s}
.sb .bd{display:flex;gap:10px;align-items:center;padding:6px 6px 16px;border-bottom:1px solid #ffffff22;margin-bottom:12px}.sb small{color:#e3b95a}
.nv{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;border:0;border-radius:14px;background:none;color:#f1dfc0;cursor:pointer;margin:2px 0;text-align:right;font-weight:600}
.nv:hover{background:#ffffff14}.nv.on{background:linear-gradient(135deg,#e3b95a,#c9962b);color:#2a1a00;font-weight:800}
main{flex:1;margin-right:262px;padding:16px 20px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top h2{margin:0;flex:1;color:var(--mr)}.who{display:flex;gap:8px;align-items:center;background:var(--cd);padding:5px 12px 5px 6px;border-radius:99px;border:1px solid var(--bd)}
.hb{display:none;background:var(--cd);border:1px solid var(--bd);border-radius:12px;font-size:22px;padding:6px 12px;cursor:pointer}
@media(max-width:860px){.sb{transform:translateX(100%)}.sb.open{transform:none;box-shadow:-20px 0 60px #0006}main{margin:0;padding:14px}.hb{display:block}.who span{display:none}.two{grid-template-columns:1fr!important}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px #6e152012}
.st .ic{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#e3b95a,#c9962b);display:grid;place-items:center;font-size:26px}.st b{display:block;font-size:28px;color:var(--mr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;padding:5px;border:1px solid var(--bd);border-radius:20px;background:#fff8;margin-bottom:16px;gap:5px}
.seg button{flex:1;padding:12px;border:0;border-radius:15px;background:none;color:var(--mu);font-weight:700;cursor:pointer;font-size:15px}.seg button.on{background:linear-gradient(135deg,#8c1c2a,#5e0f1a);color:#fff;box-shadow:0 8px 20px #6e152044}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.chip{white-space:nowrap;padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;color:var(--tx)}.chip.on{background:var(--mr);color:#fff;border-color:var(--mr)}
.pill{padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}.pill.p{background:#dff3e4;color:#1d7a3a}.pill.a{background:#fbe0dd;color:#b3372f}.pill.n{background:#eee;color:#888}
.bar{height:10px;border-radius:9px;background:#eadfc6;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9962b,#e3b95a)}
.fl{display:block;margin:12px 0 2px;color:var(--mu);font-size:14px}.ig{position:relative}.ig i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-style:normal}.ig input{padding-inline-start:44px}
#wel{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 22px;background:radial-gradient(circle at 12% 0,#fff,transparent 45%),radial-gradient(circle at 90% 100%,#e6d2a455,transparent 50%),var(--bg);position:relative;overflow:hidden;animation:up .6s}
#wel::before{content:"";position:absolute;width:150vw;height:150vw;border:1px solid #c9962b40;border-radius:50%;top:-95vw;left:-50vw}#wel::after{content:"";position:absolute;width:120vw;height:120vw;border:1px solid #c9962b33;border-radius:50%;bottom:-85vw;right:-40vw}#wel>*{position:relative;z-index:1}
.frame{width:230px;height:230px;border-radius:50%;padding:13px;background:conic-gradient(from 200deg,#8a6314,#f6e3a1,#c9962b,#fff1bd,#8a6314);box-shadow:0 26px 50px #8a631466,inset 0 0 0 3px #fff7}.frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.eb{letter-spacing:4px;color:#b88a2e;font-weight:800;font-size:13px;margin:30px 0 6px}#wel h1{font-size:42px;color:var(--mr);margin:2px 0;font-weight:800}.en{font-family:"Playfair Display",serif;font-size:24px;color:#b88a2e}.cls{margin-top:6px;color:var(--mr);font-weight:700}#wel p{max-width:420px;line-height:2;color:#5a4d4d;margin:12px 0 20px}
.wb{display:block;width:100%;max-width:310px;padding:16px;border-radius:20px;font-weight:800;font-size:18px;border:0;cursor:pointer;margin:8px auto}.wb.p{background:linear-gradient(135deg,#8c1c2a,#5e0f1a);color:#fff;box-shadow:0 14px 28px #6e152055}.wb.s{background:#fff;color:var(--mr);border:1px solid #e3d5b5}
.lc{max-width:480px;margin:18px auto;padding:26px 22px;border-radius:32px;background:var(--cd);border:1px solid var(--bd);box-shadow:0 30px 60px #6e152022;animation:up .4s}.lc h2{font-size:32px;margin:8px 0 4px;color:var(--mr)}.lc .sub{color:var(--mu);margin-bottom:18px}
.lc .logo{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--go)}.lc .full{width:100%;padding:16px;font-size:18px;margin:18px 0 0}.lc input,.lc select,.lc textarea{padding:15px;border-radius:18px;font-size:16px}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:6px;border-radius:6px;background:var(--bd)}.prog i.on{background:linear-gradient(90deg,#c9962b,#8c1c2a)}
.pv{width:120px;height:120px;border-radius:50%;margin:10px auto;border:3px dashed var(--go);display:grid;place-items:center;font-size:44px;overflow:hidden;background:#fff}.pv img{width:100%;height:100%;object-fit:cover}
.camo{position:fixed;inset:0;background:#000e;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.camo video{max-width:92vw;max-height:70vh;border-radius:22px}
.chat{display:grid;grid-template-columns:230px 1fr;gap:12px;height:72vh}.cl{overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:8px}
.ci{display:flex;gap:8px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;font-weight:600}.ci.on{background:linear-gradient(135deg,#8c1c2a,#5e0f1a);color:#fff}.dot{width:9px;height:9px;border-radius:50%;background:#2fb36a;margin-inline-start:auto}
.cp{display:flex;flex-direction:column;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:10px;min-width:0}.msgs{flex:1;overflow:auto;padding:4px}
.m{padding:9px 13px;border-radius:18px 18px 18px 4px;margin:5px 0;max-width:82%;background:#f3ead7;word-break:break-word}.m.me{background:linear-gradient(135deg,#8c1c2a,#5e0f1a);color:#fff;margin-inline-start:auto;border-radius:18px 18px 4px 18px}.m.me small{color:#f1dfc0}.tm{display:block;font-size:11px;margin-top:2px}
.cin{flex-wrap:nowrap}.cin input{flex:1}
@media(max-width:700px){.chat{grid-template-columns:1fr;height:auto}.cl{display:flex;gap:6px;overflow-x:auto}.ci{white-space:nowrap}.msgs{height:50vh}}
.t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;max-width:520px;margin:auto;background:linear-gradient(135deg,#e3b95a,#c9962b);color:#2a1a00;font-weight:700;padding:14px;border-radius:16px;z-index:99;text-align:center;box-shadow:0 14px 40px #0006;animation:up .3s}
.pr{line-height:2.1;white-space:pre-line}
.card{padding:20px;margin-bottom:20px}.card h3{margin-bottom:16px}.card small{line-height:2}
.li{padding:14px 0}.row{gap:12px}.b{margin:5px 6px;padding:12px 20px}input,select,textarea{margin:8px 0}.fl{margin:18px 0 4px}
.stats{gap:18px;margin-bottom:20px}.two{gap:20px}main{padding:22px 24px 50px}.nv{margin:5px 0;padding:13px 16px}.chips{gap:10px;padding-bottom:12px;margin-bottom:14px}
.top{margin-bottom:22px}.m{margin:8px 0;padding:11px 15px}.seg{margin-bottom:22px}.st{padding:20px}.pv small{font-size:14px}
@media(max-width:860px){main{padding:16px}.card{padding:16px}}
.ig input{padding-inline-start:15px!important}.ig i{display:none}
.dayl{margin:14px 0 4px;padding:10px 14px;border-radius:14px;background:#fff;border:1px dashed var(--go);color:var(--mr)}
</style></head><body><div id="app"></div>

async function inflate(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function readXlsx(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>0&&dv.getUint32(e,true)!==0x06054b50)e--;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const F={};
for(let i=0;i<n;i++){const me_=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
if(/^xl\/(sharedStrings|worksheets\/sheet1)\.xml$/.test(name)){const ln=dv.getUint16(lo+26,true),lx=dv.getUint16(lo+28,true),d=u.subarray(lo+30+ln+lx,lo+30+ln+lx+cs);F[name]=new TextDecoder().decode(me_?await inflate(d):d)}}
const X=t=>new DOMParser().parseFromString(t,'text/xml'),ss=F['xl/sharedStrings.xml']?[...X(F['xl/sharedStrings.xml']).getElementsByTagName('si')].map(s=>[...s.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
return [...X(F['xl/worksheets/sheet1.xml']).getElementsByTagName('row')].map(r=>{const o=[];[...r.getElementsByTagName('c')].forEach(c=>{const k=c.getAttribute('r').replace(/\d/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,v=c.getElementsByTagName('v')[0],t=c.getAttribute('t');o[k]=t=='s'?ss[+v.textContent]:t=='inlineStr'?(c.getElementsByTagName('t')[0]||{}).textContent:v?v.textContent:''});return o})}
